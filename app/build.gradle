plugins { id 'com.android.application' }

android {
    namespace 'com.kejian.app'
    compileSdk 37
    defaultConfig {
        applicationId 'com.kejian.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.kejian.app.SmokeTest'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
